<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUNCOAST: HEATLINE — GTA-style open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1210; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game-host { position: fixed; inset: 0; }
  #game-host canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  #hud-top-left { position: absolute; top: 18px; left: 20px; }
  #hud-cash { font-size: 34px; font-weight: 800; color: #7dff8a; }
  #hud-job { font-size: 20px; font-weight: 700; margin-top: 2px; }
  #hud-rep { font-size: 15px; font-weight: 600; color: #ffd23e; margin-top: 2px; }
  #hud-top-right { position: absolute; top: 18px; right: 20px; text-align: right; }
  #hud-wanted { font-size: 26px; letter-spacing: 4px; }
  #hud-speed { font-size: 30px; font-weight: 800; }
  #hud-drift { font-size: 16px; font-weight: 700; color: #7ad0ff; }
  #hud-objective { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); font-size: 19px; font-weight: 700; background: rgba(0,0,0,.45); padding: 8px 18px; border-radius: 8px; white-space: nowrap; }
  #hud-police { position: absolute; top: 150px; right: 20px; text-align: right; font-size: 14px; font-weight: 600; background: rgba(120,0,0,.45); padding: 8px 12px; border-radius: 8px; }
  #hud-police div { padding: 2px 0; }
  #hud-toast { position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 700; background: rgba(0,0,0,.55); padding: 8px 18px; border-radius: 8px; }
  #hud-controls { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 13px; opacity: .85; white-space: nowrap; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="game-host"></div>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite">SUNCOAST: HEATLINE — drive the HEATLINE GT, run jobs for Rae, lose the heat.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
